name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r api/requirements.txt

      - name: Compile Python sources
        run: python -m compileall api camera scripts

      - name: Run unit tests
        env:
          SERIAL_ENABLED: "false"
          DATABASE_PATH: ":memory:"
        run: python -m unittest discover -s api/tests -v

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run software-only integration demo
        env:
          SERIAL_ENABLED: "false"
          DATABASE_PATH: /tmp/tcc-demo-ci.db
        run: |
          rm -f /tmp/tcc-demo-ci.db
          uvicorn api.api:app --host 127.0.0.1 --port 8000 > /tmp/tcc-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if python -c "import requests; requests.get('http://127.0.0.1:8000/api/health', timeout=1).raise_for_status()"; then
              break
            fi

            if [ "$attempt" -eq 20 ]; then
              cat /tmp/tcc-api.log
              exit 1
            fi

            sleep 1
          done

          python scripts/demo_api.py --verify --base-url http://127.0.0.1:8000

  dashboard:
    name: Dashboard checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint dashboard
        run: npm run lint

      - name: Build dashboard
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build

  firmware:
    name: Firmware reference build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"

      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Install firmware libraries
        run: |
          arduino-cli lib install "ArduinoJson@7.4.3"
          arduino-cli lib install "LiquidCrystal I2C@1.1.2"
          arduino-cli lib install "Servo@1.3.0"

      - name: Compile reference target
        run: arduino-cli compile --warnings all --fqbn arduino:avr:uno Arduino/esteira
