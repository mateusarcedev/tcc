name: Temporary lockfile sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'chore/portfolio-security-hardening'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate lockfile
        working-directory: dashboard
        run: npm install

      - name: Verify dependency security
        working-directory: dashboard
        run: npm audit --omit=dev --audit-level=high

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git commit -m "build: lock dashboard dependencies"
          git push origin "HEAD:${{ github.head_ref }}"
